name: Compatibility drift check

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Verify exact maintained compatibility envelope
        run: |
          npm ci --include=dev
          npm run verify:fork
      - name: Report available Codex and ACP SDK versions
        shell: bash
        run: |
          set -euo pipefail
          current_codex=$(node -p "require('./package.json').dependencies['@openai/codex']")
          current_sdk=$(node -p "require('./package.json').dependencies['@agentclientprotocol/sdk']")
          latest_codex=$(npm view '@openai/codex' version)
          latest_sdk=$(npm view '@agentclientprotocol/sdk' version)
          {
            echo '## Maintained-fork dependency inspection'
            echo
            echo "- @openai/codex: pinned \`$current_codex\`; registry \`$latest_codex\`"
            echo "- @agentclientprotocol/sdk: pinned \`$current_sdk\`; registry \`$latest_sdk\`"
            echo
            echo 'Updates require a reviewed exact-pin compatibility PR; this workflow never modifies or publishes.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$current_codex" != "$latest_codex" || "$current_sdk" != "$latest_sdk" ]]; then
            echo '::notice::Compatibility review is due; see docs/MAINTENANCE.md.'
          fi
