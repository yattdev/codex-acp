name: Packaged guarded-TTY acceptance

on:
  workflow_dispatch:

permissions: {}

jobs:
  packaged-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --include=dev
      - name: Verify fork and fake-App-Server contract
        run: |
          npm run verify:fork
          npm run test:guarded-tty
          npm test
          npm run build
          npm run verify:package
      - name: Smoke-test locally packed CLI
        shell: bash
        run: |
          set -euo pipefail
          package_dir=$(mktemp -d)
          install_dir=$(mktemp -d)
          npm pack --pack-destination "$package_dir" --ignore-scripts
          npm install --prefix "$install_dir" --ignore-scripts "$package_dir"/*.tgz
          "$install_dir/node_modules/.bin/codex-acp-kandev" --version \
            | grep -Fx '@yattdev/codex-acp-kandev 1.7.0-kandev.1'

# Live-model testing is intentionally not a release gate. This workflow uses
# the deterministic fake App Server fixtures and requires no repository secret.
