name: Packaged guarded-TTY acceptance

on:
  workflow_dispatch:

permissions: {}

jobs:
  packaged-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --include=dev
      - name: Verify fork and fake-App-Server contract
        run: |
          npm run verify:fork
          npm run test:guarded-tty
          npm test
          npm run build
          npm run verify:package
      - name: Exercise the installed tarball against the fake App Server
        run: npm run test:packed-guarded-tty

# Live-model testing is intentionally not a release gate. This workflow uses
# the deterministic fake App Server fixtures and requires no repository secret.
