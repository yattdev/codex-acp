name: Publish Kandev prerelease

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing protected kandev-v* release tag
        required: true
        type: string

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Dispatch secretless CI for the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_branch=$(gh pr list --state open --label 'autorelease: pending' \
            --json headRefName --jq 'if length == 1 then .[0].headRefName else error("expected one release PR") end')
          config_path='release-please-config.json'
          config_sha=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${config_path}?ref=${release_branch}" --jq .sha)
          config=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${config_path}?ref=${release_branch}" \
            -H 'Accept: application/vnd.github.raw')
          if jq -e '.packages["."]["release-as"] != null' <<<"$config" >/dev/null; then
            content=$(jq 'del(.packages["."]["release-as"])' <<<"$config" | base64 -w0)
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${config_path}" \
              -f message='chore: consume initial Kandev release override' \
              -f content="$content" \
              -f sha="$config_sha" \
              -f branch="$release_branch" >/dev/null
          fi
          gh workflow run ci.yml --ref "$release_branch"
      - name: Dispatch publication from the exact release tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --ref "$TAG" -f release_tag="$TAG"

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate release identity
        env:
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/tags/$TAG" ]]
          [[ "$TAG" =~ ^kandev-v[0-9]+\.[0-9]+\.[0-9]+-kandev\.[0-9]+$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.1.2
        with:
          bun-version: 1.3.11
      - name: Repeat secretless release gates
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache
        run: |
          npm ci --include=dev
          npm run verify:fork
          npm run typecheck
          npm run test:guarded-tty
          npm test
          npm run build
          npm run bundle:all
          npm run package:all
          npm run verify:package
          npm run test:packed-guarded-tty
          npm audit --omit=dev
      - name: Create immutable checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum dist/bin/*.zip > dist/bin/SHA256SUMS
          sha256sum --check dist/bin/SHA256SUMS
      - name: Attest release archives and checksum manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/bin/*.zip
            dist/bin/SHA256SUMS
      - name: Verify release attestations before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for artifact in dist/bin/*.zip dist/bin/SHA256SUMS; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Upload immutable assets to the Kandev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          release_assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets)
          for artifact in dist/bin/*.zip dist/bin/SHA256SUMS; do
            name=$(basename "$artifact")
            if jq -e --arg name "$name" '.assets[]? | select(.name == $name)' <<<"$release_assets" >/dev/null; then
              download_dir=$(mktemp -d)
              gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$name" --dir "$download_dir"
              cmp "$artifact" "$download_dir/$name"
            else
              gh release upload "$TAG" "$artifact" --repo "$GITHUB_REPOSITORY"
            fi
          done
      - name: Publish or verify the immutable npm version
        env:
          EXPECTED_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          expected_version=${EXPECTED_TAG#kandev-v}
          [[ "$package_version" == "$expected_version" ]]
          latest_before=$(npm view '@yattdev/codex-acp-kandev' dist-tags.latest 2>/dev/null || true)
          if ! npm publish --access public --tag kandev; then
            existing=$(npm view "@yattdev/codex-acp-kandev@$expected_version" version 2>/dev/null || true)
            [[ "$existing" == "$expected_version" ]]
            echo '::notice::The exact immutable npm version already exists; repeating post-publish verification.'
          fi
          published=$(npm view "@yattdev/codex-acp-kandev@$expected_version" version)
          kandev_tag=$(npm view '@yattdev/codex-acp-kandev' dist-tags.kandev)
          latest_after=$(npm view '@yattdev/codex-acp-kandev' dist-tags.latest 2>/dev/null || true)
          [[ "$published" == "$expected_version" ]]
          [[ "$kandev_tag" == "$expected_version" ]]
          [[ "$latest_after" == "$latest_before" ]]
          [[ "$latest_after" != "$expected_version" ]]
          verification_dir=$(mktemp -d)
          npm install --prefix "$verification_dir" --ignore-scripts \
            "@yattdev/codex-acp-kandev@$expected_version"
          npm audit signatures --prefix "$verification_dir"
          node scripts/verify-npm-provenance.mjs "$expected_version" "$EXPECTED_TAG"

# The one-time npm scope/package and trusted-publisher binding is Human-owned.
# This workflow has no token fallback, does not update an upstream registry, and
# performs no deployment.
